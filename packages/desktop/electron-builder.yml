appId: com.redamancyer.proplan
productName: Proplan
directories:
  buildResources: build
  output: ../../dist
files:
  - '!**/.vscode/*'
  - '!src/*'
  - '!scripts/*'
  - '!electron.vite.config.{js,ts,mjs,cjs}'
  - '!{.eslintcache,eslint.config.mjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}'
  - '!{.env,.env.*,.npmrc,pnpm-lock.yaml}'
  # ================================
  # Do not bundle these files
  # ================================
  - '!node_modules/**/*.js.map'
  - '!node_modules/**/*.cjs.map'
  - '!node_modules/**/*.mjs.map'
  - '!node_modules/**/*.ts.map'
  # Large source files
  - '!node_modules/mermaid/dist/mermaid.js'
  - '!node_modules/mermaid/dist/mermaid.min.js'
  - '!node_modules/mermaid/dist/mermaid.esm.min.mjs'
  - '!node_modules/katex/dist/katex.min.js'
  - '!node_modules/katex/dist/katex.mjs'
  # Don't bundle Linux build files
  - '!node_modules/**/{*.vcxproj,*.vcxproj.filters}'
  - '!node_modules/**/build/Release/{*.lib,*.exp,*.ilk,*.pdb,*.iobj,*.ipdb}'
  - '!node_modules/**/build/Release/obj'
  # Do not bundle development related files
  - '!eslint.config.js'
  - '!jsconfig.json'
  - '!docs/*'
extraResources:
  - from: build/LICENSE.txt
    to: licenses/LICENSE.txt
  - from: build/THIRD-PARTY-LICENSES.txt
    to: licenses/THIRD-PARTY-LICENSES.txt
  - from: build/icons
    to: icons # ends up at resources/icons/
    filter:
      - '*.ico'
  - from: static
    to: static
    filter:
      - '**/*'
      - '!locales/**/!(*.min).json'
npmRebuild: false
electronLanguages: # Avoid packaging all chromium locales since our app has in-built locales
  - en-US

asarUnpack:
  - resources/**
publish:
  provider: github
  owner: Redamancyer
  repo: Proplan
  # Separate channels prevent x64 and arm64 release jobs from overwriting each other.
  channel: 'latest-${arch}'
win:
  executableName: Proplan
  artifactName: 'Proplan-win-${arch}-${version}.${ext}'
  target:
    - target: 'nsis'
    - target: 'zip'
  icon: static/icon.ico
nsis:
  artifactName: 'Proplan-win-${arch}-${version}-setup.${ext}'
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: true
  createStartMenuShortcut: true
  oneClick: false
  allowToChangeInstallationDirectory: true
  perMachine: false
  include: windows/installer.nsh
mac:
  artifactName: 'Proplan-mac-${arch}-${version}.${ext}'
  identity: '-'
  entitlementsInherit: build/mac/entitlements.mac.plist
  extendInfo:
    NSCameraUsageDescription: Application requests access to the device's camera.
    NSDocumentsFolderUsageDescription: Application requests access to the user's Documents folder.
    NSDownloadsFolderUsageDescription: Application requests access to the user's Downloads folder.
  icon: static/icon.icns
  notarize: false
  target:
    - dmg
    - zip
dmg:
  artifactName: 'Proplan-mac-${arch}-${version}.${ext}'
  contents:
    - x: 410
      y: 240
      type: 'link'
      path: '/Applications'
    - x: 130
      y: 240
      type: 'file'
linux:
  artifactName: 'Proplan-linux-${version}.${ext}'
  executableName: 'Proplan'
  description: 'A project notes, tasks, and timeline management desktop app.'
  maintainer: 'Redamancyer'
  category: 'Office;Utility'
  icon: 'static/icon.png'
  desktop:
    entry:
      StartupWMClass: 'Proplan'
      Keywords: 'Proplan;projects;notes;tasks;'
  target:
    - AppImage
    - snap
    - deb
    - rpm
    - tar.gz
