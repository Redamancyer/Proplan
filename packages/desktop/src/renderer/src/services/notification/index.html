<div class="mt-notification">
  <div class="notice-bg"></div>
  <div class="fluent-container">
    <div class="fluent"></div>
  </div>
  <div class="content">
    <div class="title">
      <div class="icon-wrapper">
        <svg class="icon notification-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          {{icon}}
        </svg>
      </div>
      <span>{{title}}</span>
      <svg class="icon close" aria-hidden="true">
        <use xlink:href="#icon-close"></use>
      </svg>
    </div>
    <div class="body">
      <div class="left-text">{{message}}</div>
      <div class="confirm icon-wrapper">
        <svg class="icon" aria-hidden="true">
          <use xlink:href="#icon-confirm"></use>
        </svg>
      </div>
    </div>
  </div>
</div>
